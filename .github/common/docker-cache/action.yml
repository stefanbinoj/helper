name: Pull or use Supabase Docker images

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Restore Docker image cache
      id: image-cache
      uses: actions/cache@v4
      with:
        path: ~/image-cache
        key: supabase-image-cache-${{ runner.os }}-${{ hashFiles('supabase/config.ci.toml', '.github/common/docker-cache/action.yml') }}
        restore-keys: |
          supabase-image-cache-${{ runner.os }}-

    - name: Pull and save Supabase images (on cache miss)
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/image-cache"

        docker pull public.ecr.aws/supabase/postgres:15.8.1.069
        docker pull public.ecr.aws/supabase/postgrest:v12.2.12
        docker pull public.ecr.aws/supabase/gotrue:v2.171.0
        docker pull public.ecr.aws/supabase/realtime:v2.34.47
        docker pull public.ecr.aws/supabase/storage-api:v1.22.11

        docker save public.ecr.aws/supabase/postgres:15.8.1.069 -o "$HOME/image-cache/supabase-postgres.tar"
        docker save public.ecr.aws/supabase/postgrest:v12.2.12 -o "$HOME/image-cache/supabase-postgrest.tar"
        docker save public.ecr.aws/supabase/gotrue:v2.171.0 -o "$HOME/image-cache/supabase-gotrue.tar"
        docker save public.ecr.aws/supabase/realtime:v2.34.47 -o "$HOME/image-cache/supabase-realtime.tar"
        docker save public.ecr.aws/supabase/storage-api:v1.22.11 -o "$HOME/image-cache/supabase-storage.tar"

    - name: Load cached Supabase images (on cache hit)
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        docker load -i ~/image-cache/supabase-postgres.tar
        docker load -i ~/image-cache/supabase-realtime.tar
        docker load -i ~/image-cache/supabase-gotrue.tar
        docker load -i ~/image-cache/supabase-storage.tar
        docker load -i ~/image-cache/supabase-postgrest.tar

