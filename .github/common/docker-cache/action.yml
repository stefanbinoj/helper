name: Pull or use Supabase Docker images

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Restore Docker image cache
      id: image-cache
      uses: actions/cache@v4
      with:
        path: ~/image-cache
        key: supabase-image-cache-${{ runner.os }}-${{ hashFiles('supabase/config.ci.toml', '.github/common/docker-cache/action.yml') }}
        restore-keys: |
          supabase-image-cache-${{ runner.os }}-

    - name: Pull and save Supabase images (on cache miss)
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/image-cache"

        docker pull supabase/postgres
        docker pull supabase/realtime
        docker pull supabase/gotrue
        docker pull supabase/storage-api
        docker pull postgrest/postgrest

        docker save supabase/postgres -o "$HOME/image-cache/supabase-postgres.tar"
        docker save supabase/realtime -o "$HOME/image-cache/supabase-realtime.tar"
        docker save supabase/gotrue -o "$HOME/image-cache/supabase-gotrue.tar"
        docker save supabase/storage-api -o "$HOME/image-cache/supabase-storage.tar"
        docker save postgrest/postgrest -o "$HOME/image-cache/postgrest-postgrest.tar"

    - name: Load cached Supabase images (on cache hit)
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        for tar in "$HOME"/image-cache/*.tar; do
          echo "Loading $tar"
          docker load -i "$tar"
        done
        shopt -u nullglob

