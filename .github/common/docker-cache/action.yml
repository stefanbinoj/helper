name: Pull or use Supabase Docker images

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Restore Docker image cache
      id: image-cache
      uses: actions/cache@v4
      with:
        path: ~/image-cache
        key: supabase-image-cache-${{ runner.os }}-${{ hashFiles('supabase/config.ci.toml') }}
        restore-keys: |
          supabase-image-cache-${{ runner.os }}-

    - name: Pull and save Supabase images (on cache miss)
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/image-cache

        docker pull supabase/postgres:${{ inputs.postgres_version }}
        docker pull supabase/realtime:${{ inputs.realtime_version }}
        docker pull supabase/gotrue:${{ inputs.gotrue_version }}
        docker pull supabase/storage-api:${{ inputs.storage_version }}
        docker pull supabase/postgrest:${{ inputs.postgrest_version }}

        docker save supabase/postgres:${{ inputs.postgres_version }} -o ~/image-cache/supabase-postgres.tar
        docker save supabase/realtime:${{ inputs.realtime_version }} -o ~/image-cache/supabase-realtime.tar
        docker save supabase/gotrue:${{ inputs.gotrue_version }} -o ~/image-cache/supabase-gotrue.tar
        docker save supabase/storage-api:${{ inputs.storage_version }} -o ~/image-cache/supabase-storage.tar
        docker save supabase/postgrest:${{ inputs.postgrest_version }} -o ~/image-cache/supabase-postgrest.tar

    - name: Load cached Supabase images (on cache hit)
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        docker load -i ~/image-cache/supabase-postgres.tar
        docker load -i ~/image-cache/supabase-realtime.tar
        docker load -i ~/image-cache/supabase-gotrue.tar
        docker load -i ~/image-cache/supabase-storage.tar
        docker load -i ~/image-cache/supabase-postgrest.tar

