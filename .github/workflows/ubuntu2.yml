name: Advanced changes here

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: true
      OPENAI_API_KEY: test-openai-api-key
      FIRECRAWL_API_KEY: test-firecrawl-api-key
      NODE_OPTIONS: --max_old_space_size=8192

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version-file: ".node-version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --ignore-scripts


      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Cache SDK build and dependencies
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/sdk/node_modules
            packages/sdk/dist
            public/sdk*.js
            public/sdk*.js.LICENSE.txt
          key: sdk-${{ runner.os }}-${{ hashFiles('packages/sdk/**', '!packages/sdk/node_modules/**', '!packages/sdk/dist/**') }}
          restore-keys: |
            sdk-${{ runner.os }}-

      - name: Cache package builds
        id: packages-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/client/dist
            packages/react/dist
          key: packages-${{ runner.os }}-${{ hashFiles('packages/client/**', 'packages/react/**', '!packages/*/node_modules/**', '!packages/*/dist/**') }}
          restore-keys: |
            packages-${{ runner.os }}-

      - name: Build SDK if needed
        run: |
          pnpm --filter="@helperai/sdk" install
          pnpm --filter="@helperai/sdk" build
        if: steps.sdk-cache.outputs.cache-hit != 'true'

      - name: Build essential packages
        run: |
          # Build @helperai/client first (dependency of react package)
          pnpm --filter="@helperai/client" build
          # Then build @helperai/react (depends on client)
          pnpm --filter="@helperai/react" build
        if: steps.packages-cache.outputs.cache-hit != 'true'

      - name: Cache Next.js build
        id: next-cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            ${{ github.workspace }}/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/client/dist/**', 'packages/react/dist/**', 'packages/sdk/dist/**', 'public/sdk*.js') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Build next
        run: pnpm with-test-env next build

      - name: Setup E2E test environment
        run: ./scripts/setup-e2e-tests.sh

      - name: Run full Playwright suite
        run: ./scripts/e2e.sh

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
