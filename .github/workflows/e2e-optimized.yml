name: Playwright E2E Tests (Optimized)

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ${{ github.repository == 'antiwork/helper' && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 30  # Reduced from 60
    env:
      CI: true
      OPENAI_API_KEY: test-openai-api-key
      FIRECRAWL_API_KEY: test-firecrawl-api-key
      NODE_OPTIONS: --max_old_space_size=8192
      PNPM_STORE_PATH: ~/.pnpm-store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Reduced depth for faster clone

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      # Enhanced caching strategy
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package.json') }}-v2
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            next-cache-${{ runner.os }}-

      # Cache database snapshot for faster setup
      - name: Cache database snapshot
        uses: actions/cache@v4
        with:
          path: /tmp/supabase_e2e_snapshot.sql
          key: db-snapshot-${{ runner.os }}-${{ hashFiles('db/**', 'supabase/**') }}-v1
          restore-keys: |
            db-snapshot-${{ runner.os }}-

      # Parallel installation
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # Use optimized setup script
      - name: Setup E2E test environment (Optimized)
        run: |
          if [ -f "./scripts/setup-e2e-tests-optimized.sh" ]; then
            ./scripts/setup-e2e-tests-optimized.sh
          else
            ./scripts/setup-e2e-tests.sh
          fi

      # Build in parallel with database setup
      - name: Build Next.js application
        run: pnpm with-test-env next build

      # Run tests with optimized settings
      - name: Run Playwright E2E tests
        run: ./scripts/e2e.sh
        env:
          # Optimize Playwright for CI
          PLAYWRIGHT_WORKERS: 4
          PLAYWRIGHT_MAX_FAILURES: 3

      - name: Upload Playwright HTML report
        if: failure()  # Only upload on failure to save time
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7  # Reduced retention