name: E2E-2-Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ${{ github.repository == 'antiwork/helper' && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CI: true
      OPENAI_API_KEY: test-openai-api-key
      FIRECRAWL_API_KEY: test-firecrawl-api-key
      NODE_OPTIONS: --max_old_space_size=8192
      PNPM_STORE_PATH: ~/.pnpm-store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            next-cache-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install supabase-cli
        uses: supabase/setup-cli@v1
        with:
          version: "latest"

      - name: Pull Supabase images
        run: |
          docker pull ghcr.io/supabase/postgres:15.8.1.085
          docker pull ghcr.io/supabase/storage-api:v1.28.2
          docker pull ghcr.io/supabase/gotrue:v2.180.0
          docker pull ghcr.io/supabase/kong:2.8.1
          docker pull ghcr.io/supabase/postgrest:v13.0.7

      - name: Start and orchestrate Supabase services
        run: |
          # Create Docker network
          docker network create supabase-net || true

          # Start Postgres database
          docker run -d \
            --name supa-db \
            --network supabase-net \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            ghcr.io/supabase/postgres:15.8.1.085

          # Wait for Postgres to be ready
          echo "Waiting for Postgres to be ready..."
          until docker exec supa-db pg_isready -U postgres; do
            echo "Postgres is unavailable - waiting..."
            sleep 1
          done
          echo "Postgres is ready"

          # Start PostgREST
          docker run -d \
            --name supa-postgrest \
            --network supabase-net \
            -e PGRST_DB_URI="postgres://postgres:postgres@supa-db:5432/postgres" \
            -e PGRST_DB_SCHEMA="public" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -p 3000:3000 \
            ghcr.io/supabase/postgrest:v13.0.7

          # Start GoTrue (auth)
          docker run -d \
            --name supa-gotrue \
            --network supabase-net \
            -e GOTRUE_DB_DRIVER="postgres" \
            -e GOTRUE_DATABASE_URL="postgres://postgres:postgres@supa-db:5432/postgres" \
            -e GOTRUE_JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long" \
            -e GOTRUE_SITE_URL="http://localhost:3000" \
            -e GOTRUE_API_HOST="0.0.0.0" \
            -e GOTRUE_API_PORT="9999" \
            -p 9999:9999 \
            ghcr.io/supabase/gotrue:v2.180.0

          # Start Storage API
          docker run -d \
            --name supa-storage \
            --network supabase-net \
            -e DATABASE_URL="postgres://postgres:postgres@supa-db:5432/postgres" \
            -e ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" \
            -e SERVICE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU" \
            -e PGRST_JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long" \
            -e REGION="local" \
            -e GLOBAL_S3_BUCKET="s3-bucket" \
            -p 5000:5000 \
            ghcr.io/supabase/storage-api:v1.28.2

          # Start Kong (API Gateway)
          docker run -d \
            --name supa-kong \
            --network supabase-net \
            -e KONG_DATABASE=off \
            -e KONG_DECLARATIVE_CONFIG=/var/lib/kong/kong.yml \
            -p 8000:8000 \
            -p 8443:8443 \
            ghcr.io/supabase/kong:2.8.1

          # Give services a moment to fully start
          sleep 5

          echo "✅ Supabase services started successfully"
          echo "API URL: http://127.0.0.1:8000"
          echo "DB URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres"

      - name: Run migrations
        run: |
          pnpm run with-test-env drizzle-kit migrate --config ./db/drizzle.config.ts

      - name: Seed database
        run: pnpm run with-test-env pnpm tsx --conditions=react-server ./db/seeds/seedDatabase.ts

      - name: Build next
        run: pnpm with-test-env next build

      - name: Run full Playwright suite
        run: ./scripts/e2e.sh

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
